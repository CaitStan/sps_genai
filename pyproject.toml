[project]
name = "sps-genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caitlin Stanton", email = "caitlin.stanton@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "spacy>=3.8.16",
    "uvicorn>=0.54.0",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "python-multipart>=0.0.20,<1",
    "pillow>=10.4,<13",
]

[project.scripts]
sps-genai = "sps_genai:main"

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
